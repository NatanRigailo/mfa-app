<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .AppName }}</title>
    <link rel="icon" href="/static/favicon.ico">
    <meta name="csrf-token" content="{{ .CSRFToken }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    <style>
        :root {
            --bg:         #0d0d0d;
            --surface:    #161616;
            --surface-2:  #1e1e1e;
            --border:     #2a2a2a;
            --border-2:   #3a3a3a;
            --text:       #f2f2f2;
            --muted:      #888;
            --accent:     #4ade80;
            --accent-dim: rgba(74, 222, 128, 0.12);
            --danger:     #f87171;
            --radius:     10px;
            --radius-sm:  6px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 52px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--text); }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        #clock { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            transition: background 0.15s, border-color 0.15s;
        }
        .btn:hover { background: #2a2a2a; border-color: var(--border-2); }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
        .btn-accent:hover { background: #22c55e; border-color: #22c55e; color: #0d0d0d; }

        main { padding: 24px; max-width: 1400px; margin: 0 auto; }

        .flash {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
            border: 1px solid;
        }
        .flash.success { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.25); color: var(--accent); }
        .flash.danger, .flash.error { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.25); color: var(--danger); }
        .flash.warning { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.25); color: #fbbf24; }
        .flash.info { background: rgba(96,165,250,0.08); border-color: rgba(96,165,250,0.25); color: #60a5fa; }

        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 9px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="text"]::placeholder { color: var(--muted); }
        input[type="file"] { padding: 6px 12px; color: var(--muted); cursor: pointer; }

        details { margin-bottom: 20px; }
        details > summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 13px;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
        }
        details > summary:hover { color: var(--text); }
        details > summary::before { content: '›'; font-size: 16px; transition: transform 0.2s; }
        details[open] > summary::before { transform: rotate(90deg); }
        .help-content {
            margin-top: 8px;
            padding: 14px 16px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }
        .help-content p { margin-bottom: 8px; }
        .help-content p:last-child { margin-bottom: 0; }
        .help-content strong { color: var(--text); }

        /* Index page */
        .search-container { display: flex; justify-content: center; margin-bottom: 28px; }
        .search-wrapper { position: relative; width: 100%; max-width: 480px; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 16px; }
        #search {
            width: 100%;
            padding: 10px 16px 10px 38px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        #search::placeholder { color: var(--muted); }
        #search:focus { border-color: var(--accent); }
        .letter-section { margin-bottom: 4px; }
        .letter-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 2px;
            cursor: pointer;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            user-select: none;
        }
        .letter-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .letter-header .toggle-icon { transition: transform 0.2s; font-size: 13px; }
        .letter-header.collapsed .toggle-icon { transform: rotate(-90deg); }
        .token-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
            gap: 8px;
            padding: 6px 0 10px;
        }
        .token-grid.hidden { display: none; }
        .token-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .token-card:hover { border-color: var(--border-2); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .token-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .token-code-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 4px; }
        .token-code { font-family: 'Courier New', Courier, monospace; font-size: 1.35em; font-weight: 700; letter-spacing: 0.12em; color: var(--text); }
        .copy-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            font-size: 17px;
            display: flex;
            align-items: center;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
            line-height: 1;
        }
        .copy-btn:hover { color: var(--text); background: var(--surface-2); }
        .copy-btn.copied { color: var(--accent); }
        .progress-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.95s linear, background 0.3s; }
        .progress-fill.danger { background: var(--danger); }
        .token-card.edit-mode { gap: 8px; }
        .token-card.edit-mode form { display: flex; flex-direction: column; gap: 8px; }
        .edit-input { width: 100%; padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
        .edit-input:focus { border-color: var(--accent); }
        .edit-checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; cursor: pointer; }
        .edit-save-btn { width: 100%; padding: 6px; background: var(--accent-dim); border: 1px solid rgba(74,222,128,0.25); border-radius: var(--radius-sm); color: var(--accent); font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
        .edit-save-btn:hover { background: rgba(74,222,128,0.2); }
        .edit-delete-btn { width: 100%; padding: 5px; background: transparent; border: 1px solid rgba(248,113,113,0.25); border-radius: var(--radius-sm); color: var(--danger); font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
        .edit-delete-btn:hover { background: rgba(248,113,113,0.1); }
        #no-results { color: var(--muted); font-size: 14px; text-align: center; padding: 48px; display: none; }
        .edit-fab { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: color 0.15s, border-color 0.15s, box-shadow 0.15s; z-index: 50; }
        .edit-fab:hover { color: var(--text); border-color: var(--border-2); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .edit-notice { position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 10px; background: var(--accent); color: #0d0d0d; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; z-index: 50; box-shadow: 0 4px 16px rgba(74,222,128,0.25); }
        .exit-edit-btn { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.15); border: none; border-radius: var(--radius-sm); color: #0d0d0d; font-family: inherit; font-size: 12px; font-weight: 600; padding: 3px 8px; cursor: pointer; transition: background 0.15s; }
        .exit-edit-btn:hover { background: rgba(0,0,0,0.25); }

        /* Register page */
        .register-wrap { max-width: 520px; margin: 0 auto; }
        .register-wrap h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; letter-spacing: -0.02em; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; color: var(--muted); font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* Register disabled page */
        .disabled-wrap { max-width: 480px; margin: 48px auto; text-align: center; }
        .disabled-wrap .icon { font-size: 48px; color: var(--muted); margin-bottom: 16px; }
        .disabled-wrap h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .disabled-wrap p { color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <span class="nav-brand">{{ .AppName }}</span>
    <div class="nav-right">
        <span id="clock"></span>
        {{ block "nav_actions" . }}
        <a href="/register" class="btn">
            <i class="ph ph-plus"></i> Registrar
        </a>
        {{ end }}
    </div>
</nav>
<main>
    {{ range .Flashes }}
    <div class="flash {{ .Category }}">{{ .Message }}</div>
    {{ end }}
    {{ block "content" . }}{{ end }}
</main>
<script>
    function updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const el = document.getElementById('clock');
        if (el) el.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
