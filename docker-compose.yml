services:
  mfa:
    image: ghcr.io/natanrigailo/mfa-app:latest
    build: .
    ports:
      - "5000:5000"
    volumes:
      - mfa_data:/data
    environment:
      APP_NAME: MFA Tokens
      # SECRET_KEY: troque-por-um-valor-seguro
      # EDIT_PASS: senha-para-edicao
      # REGISTER_ABLE: "true"
      # LOG_LEVEL: INFO

      # MySQL (opcional — remova o bloco abaixo para usar SQLite)
      # DB_HOST: db
      # DB_USER: mfa
      # DB_PASSWORD: senha
      # DB_DATABASE: mfa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # db:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_DATABASE: mfa
  #     MYSQL_USER: mfa
  #     MYSQL_PASSWORD: senha
  #     MYSQL_ROOT_PASSWORD: root
  #   volumes:
  #     - mysql_data:/var/lib/mysql

volumes:
  mfa_data:
  # mysql_data:
