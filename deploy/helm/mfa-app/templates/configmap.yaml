apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mfa-app.fullname" . }}
  labels:
    {{- include "mfa-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TABLE_NAME: {{ .Values.config.tableName | quote }}
  SQLITE_PATH: {{ .Values.config.sqlitePath | quote }}
  REGISTER_ABLE: {{ .Values.config.registerAble | quote }}
  MAX_UPLOAD_MB: {{ .Values.config.maxUploadMb | quote }}
  {{- if .Values.config.dbDriver }}
  DB_DRIVER: {{ .Values.config.dbDriver | quote }}
  {{- end }}
  {{- if .Values.config.dbHost }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  {{- end }}
  {{- if .Values.config.dbUser }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  {{- end }}
  {{- if .Values.config.dbDatabase }}
  DB_DATABASE: {{ .Values.config.dbDatabase | quote }}
  {{- end }}
