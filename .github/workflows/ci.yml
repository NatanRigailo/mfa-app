name: CI

on:
  pull_request:
    branches: [beta, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128
        with:
          version: latest

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/mfa-app/

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            --proto '=https' --tlsv1.2 \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifest
        run: kubeconform -strict -summary deploy/kubernetes.yaml

      - name: Validate rendered Helm templates
        run: |
          helm template mfa-app deploy/helm/mfa-app/ \
            --set config.secretKey=ci \
            --set config.editPass=ci \
            | kubeconform -strict -summary -

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mfa_test
          POSTGRES_USER: mfa
          POSTGRES_PASSWORD: mfa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          POSTGRES_TEST_DSN: postgres://mfa:mfa@localhost:5432/mfa_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "Coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{if(p+0 < 80){printf "Coverage %.1f%% is below 80%% threshold\n", p; exit 1}}'

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build-and-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and load amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mfa-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mfa-app:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Load amd64 image from cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mfa-app:ci
          cache-from: type=gha

      - name: Start app container
        run: |
          docker run -d --name mfa-dast \
            -p 5000:5000 \
            -e SECRET_KEY=dast-ci-key-not-for-production \
            mfa-app:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/healthz > /dev/null; then
              echo "App ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in 60s" && exit 1

      - name: Run ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run --user root --network host \
            -v ${{ github.workspace }}/.zap/rules.tsv:/zap/rules.tsv:ro \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -c /zap/rules.tsv \
            -r report.html \
            -w report.md

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-reports
          path: zap-reports/
          retention-days: 7

      - name: Stop app container
        if: always()
        run: docker stop mfa-dast && docker rm mfa-dast

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
