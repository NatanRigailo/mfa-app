name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 .

  sast:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r . -ll

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t mfa-app:ci .

      - name: Save image
        run: docker save mfa-app:ci | gzip > mfa-app.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: mfa-app.tar.gz
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load image
        run: docker load < mfa-app.tar.gz

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mfa-app:ci
          format: table
          exit-code: 1
          severity: CRITICAL

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
