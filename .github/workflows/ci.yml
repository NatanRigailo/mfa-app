name: CI

on:
  pull_request:
    branches: [beta, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128
        with:
          version: latest

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "Coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{if(p+0 < 80){printf "Coverage %.1f%% is below 80%% threshold\n", p; exit 1}}'

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t mfa-app:ci .

      - name: Save image
        run: docker save mfa-app:ci | gzip > mfa-app.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: mfa-app.tar.gz
          retention-days: 1

  scan:
    name: Scan
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load image
        run: docker load < mfa-app.tar.gz

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mfa-app:ci
          format: table
          exit-code: 1
          severity: CRITICAL

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
