name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [tag]
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/natanrigailo/mfa-app
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.new_tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm chart version
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^version:.*/version: \"${VERSION}\"/" deploy/helm/mfa-app/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/mfa-app/Chart.yaml

      - name: Package Helm chart
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          helm package deploy/helm/mfa-app/ --version "${VERSION}" --app-version "${VERSION}"

      - name: Push Helm chart to GHCR
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          VERSION="${TAG#v}"
          helm registry login ghcr.io --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          helm push "mfa-app-${VERSION}.tgz" oci://ghcr.io/natanrigailo

      - name: Create GitHub Release
        env:
          TAG: ${{ needs.tag.outputs.new_tag }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            mfa-app-*.tgz
            deploy/kubernetes.yaml
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/natanrigailo/mfa-app:${{ needs.tag.outputs.new_tag }}
            ```

            | Tag | Imagem |
            |-----|--------|
            | versão exata | `ghcr.io/natanrigailo/mfa-app:${{ needs.tag.outputs.new_tag }}` |
            | latest | `ghcr.io/natanrigailo/mfa-app:latest` |

            ## Kubernetes

            ```bash
            # Raw manifest
            kubectl apply -f https://github.com/NatanRigailo/mfa-app/releases/download/${{ needs.tag.outputs.new_tag }}/kubernetes.yaml

            # Helm (OCI)
            helm install mfa-app oci://ghcr.io/natanrigailo/mfa-app --version ${{ needs.tag.outputs.new_tag }}
            ```

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [release]
    permissions: {}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
